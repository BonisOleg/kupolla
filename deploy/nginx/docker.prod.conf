# HTTPS vhost: підключається через docker-compose.prod.yml
# після випуску сертифіката certbot на хості
# (/etc/letsencrypt монтується в контейнер read-only).

resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP → HTTPS
server {
    listen 80 default_server;
    server_name kupolla.com www.kupolla.com _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl default_server;
    http2 on;
    server_name kupolla.com www.kupolla.com _;

    ssl_certificate     /etc/letsencrypt/live/kupolla.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kupolla.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
